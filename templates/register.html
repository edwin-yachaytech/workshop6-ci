<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Register</title>
</head>
<body>
  <h1>Register</h1>
  {% if error %}<p style="color: red;">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('register') }}">
    <p><label>Student name <input type="text" name="name" value="{{ name }}"></label></p>
    <p><label>Course
      <select name="course">
        {% for course in courses %}
        <option value="{{ course.id }}" {% if course.id == selected %}selected{% endif %}>{{ course.title }} ({{ course.seats }} seats)</option>
        {% endfor %}
      </select>
    </label></p>
    <button type="submit">Register</button>
  </form>
</body>
</html>
